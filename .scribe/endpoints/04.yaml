        name: per_page
        description: 'Must be at least 1. Must not be greater than 50.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      per_page: 1
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "status": 200,
