name: Feed
description: |-

  Read published posts, newest first: either every author's posts (for
  consumers with no follow system) or one user's merged feed (own posts +
  followed users' posts).
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: internal/feed
    metadata:
      custom: []
      groupName: Feed
      groupDescription: |-

        Read published posts, newest first: either every author's posts (for
        consumers with no follow system) or one user's merged feed (own posts +
        followed users' posts).
      subgroup: ''
      subgroupDescription: ''
      title: 'Get the global feed'
      description: |-
        Returns every author's published posts, newest first, cursor-paginated.
        Use this when the calling backend has no follow/following system.
        Draft/hidden posts are excluded.
      authenticated: false
      deprecated: false
    headers:
      X-Internal-Timestamp: 'required Unix timestamp used in the HMAC signature. Example: 1735689600'
      X-Internal-Signature: 'required HMAC-SHA256 signature — see the Authentication section. Example: 5e1a3f...c9'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      per_page:
        custom: []
        name: per_page
        description: 'Number of posts per page (1-50). Defaults to 15.'
        required: false
        example: 15
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
      per_page: 15
    bodyParameters:
      per_page:
        custom: []
        name: per_page
        description: 'Must be at least 1. Must not be greater than 50.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      per_page: 1
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "status": 200,
            "message": "Feed retrieved successfully.",
            "data": [
              {
                "id": 1001,
                "author_id": 42,
                "content": "Hello world",
                "type": "text",
                "status": "published",
                "likes_count": 3,
                "comments_count": 1,
                "reposts_count": 0,
                "reposted_from_id": null,
                "posted_at": "2026-08-06T12:00:00.000000Z",
                "media": [],
                "hashtags": ["laravel"]
              }
            ],
            "next_cursor": "eyJwb3N0ZWRfYXQiOiIyMDI2LTA4LTA2IDEyOjAwOjAwIn0",
            "prev_cursor": null,
            "per_page": 15,
            "links": {
              "first": null,
              "last": null,
              "prev": null,
              "next": "http://localhost/internal/feed?cursor=eyJwb3N0ZWRfYXQiOiIyMDI2LTA4LTA2IDEyOjAwOjAwIn0"
            }
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: 'internal/feed/{userId}'
    metadata:
      custom: []
      groupName: Feed
      groupDescription: |-

        Read published posts, newest first: either every author's posts (for
        consumers with no follow system) or one user's merged feed (own posts +
        followed users' posts).
      subgroup: ''
      subgroupDescription: ''
      title: "Get a user's feed"
      description: |-
        Returns the user's own posts and their followed users' posts, newest
        first, cursor-paginated. Draft/hidden posts are excluded.
      authenticated: false
      deprecated: false
    headers:
      X-Internal-Timestamp: 'required Unix timestamp used in the HMAC signature. Example: 1735689600'
      X-Internal-Signature: 'required HMAC-SHA256 signature — see the Authentication section. Example: 5e1a3f...c9'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      userId:
        custom: []
        name: userId
        description: 'The id of the user whose feed to build, as used by the calling backend.'
        required: true
        example: 42
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
