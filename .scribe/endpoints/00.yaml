name: Posts
description: |-

  Sync a consuming backend's posts into the feed microservice's own copy.
endpoints:
  -
    custom: []
    httpMethods:
      - PUT
    uri: 'internal/posts/{id}'
    metadata:
      custom: []
      groupName: Posts
      groupDescription: |-

        Sync a consuming backend's posts into the feed microservice's own copy.
      subgroup: ''
      subgroupDescription: ''
      title: 'Sync a post'
      description: |-
        Idempotent upsert: creates the post if it doesn't exist locally yet, or
        updates it if it does. The {id} must be the same id the calling backend
        uses for this post — it becomes this service's primary key too.
      authenticated: false
      deprecated: false
    headers:
      X-Internal-Timestamp: 'required Unix timestamp used in the HMAC signature. Example: 1735689600'
      X-Internal-Signature: 'required HMAC-SHA256 signature — see the Authentication section. Example: 5e1a3f...c9'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      id:
        custom: []
        name: id
        description: "The post's id, as used by the calling backend."
        required: true
        example: 1001
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      id: 1001
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      author_id:
        custom: []
        name: author_id
        description: "The post author's id, as used by the calling backend. Must be at least 1."
        required: true
        example: 42
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      content:
        custom: []
        name: content
        description: 'The post text.'
        required: false
        example: 'Hello world'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      type:
        custom: []
        name: type
        description: 'One of: text, image, video, multi_image.'
        required: true
        example: text
        type: string
        enumValues:
          - text
          - image
          - video
          - multi_image
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      status:
        custom: []
        name: status
        description: 'One of: published, draft, hidden. Only published posts appear in feeds.'
        required: true
        example: published
        type: string
        enumValues:
          - published
          - draft
          - hidden
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      likes_count:
        custom: []
        name: likes_count
        description: 'Current like count, as tracked by the calling backend. Must be at least 0.'
        required: true
        example: 3
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      comments_count:
        custom: []
        name: comments_count
        description: 'Current comment count, as tracked by the calling backend. Must be at least 0.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      reposts_count:
        custom: []
        name: reposts_count
        description: 'Current repost count, as tracked by the calling backend. Must be at least 0.'
        required: true
        example: 0
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      reposted_from_id:
        custom: []
        name: reposted_from_id
        description: 'If this is a repost, the id of the original post (must already be synced). Must be at least 1.'
        required: false
        example: null
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      posted_at:
        custom: []
        name: posted_at
        description: "The post's original creation time in the calling backend — used for feed ordering. Must be a valid date."
        required: true
        example: '2026-08-06T12:00:00Z'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      media:
        custom: []
        name: media
        description: 'Attached media, replacing whatever was previously stored for this post.'
        required: false
        example: null
        type: 'object[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      hashtags:
        custom: []
        name: hashtags
        description: 'A hashtag name, without the leading #. Must not be greater than 255 characters.'
        required: false
        example:
          - laravel
        type: 'string[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'media[].url':
        custom: []
        name: 'media[].url'
        description: 'A publicly resolvable media URL. Must be a valid URL.'
        required: true
        example: 'https://example.com/media/1.jpg'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'media[].position':
        custom: []
        name: 'media[].position'
        description: 'Display order within the post, 0-indexed. Must be at least 0.'
        required: false
        example: 0
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      author_id: 42
      content: 'Hello world'
      type: text
      status: published
      likes_count: 3
      comments_count: 1
      reposts_count: 0
      posted_at: '2026-08-06T12:00:00Z'
      hashtags:
        - laravel
      media:
        -
          url: 'https://example.com/media/1.jpg'
          position: 0
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"status": 200, "message": "Post synced successfully."}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"status": 422, "message": "The given data was invalid.", "error": {"author_id": ["The author id field is required."]}}'
        headers: []
        description: 'Validation error'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - DELETE
    uri: 'internal/posts/{id}'
    metadata:
      custom: []
      groupName: Posts
      groupDescription: |-

        Sync a consuming backend's posts into the feed microservice's own copy.
      subgroup: ''
      subgroupDescription: ''
      title: 'Delete a post'
      description: 'Idempotent: returns 200 whether or not the post existed locally.'
      authenticated: false
      deprecated: false
    headers:
      X-Internal-Timestamp: 'required Unix timestamp used in the HMAC signature. Example: 1735689600'
      X-Internal-Signature: 'required HMAC-SHA256 signature — see the Authentication section. Example: 5e1a3f...c9'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      id:
        custom: []
        name: id
        description: "The post's id, as used by the calling backend."
        required: true
        example: 1001
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      id: 1001
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"status": 200, "message": "Post deleted successfully."}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
