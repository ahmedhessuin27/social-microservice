name: Posts
description: |-

  Create, read, edit and delete posts. This service is the source of truth
  for posts: it assigns their ids and keeps their like/comment/repost counts.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: internal/posts
    metadata:
      custom: []
      groupName: Posts
      groupDescription: |-

        Create, read, edit and delete posts. This service is the source of truth
        for posts: it assigns their ids and keeps their like/comment/repost counts.
      subgroup: ''
      subgroupDescription: ''
      title: 'Create a post'
      description: ''
      authenticated: false
      deprecated: false
    headers:
      X-Internal-Timestamp: 'required Unix timestamp used in the HMAC signature. Example: 1735689600'
      X-Internal-Signature: 'required HMAC-SHA256 signature — see the Authentication section. Example: 5e1a3f...c9'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      author_id:
        custom: []
        name: author_id
        description: "The post author's id, as used by the calling backend. Must be at least 1."
        required: true
        example: 42
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      content:
        custom: []
        name: content
        description: 'The post text. Required unless media is sent. This field is required when <code>media</code> is not present.'
        required: false
        example: 'Hello world'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      type:
        custom: []
        name: type
        description: 'One of: text, image, video, multi_image.'
        required: true
        example: text
        type: string
        enumValues:
          - text
          - image
          - video
          - multi_image
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      status:
        custom: []
        name: status
        description: 'One of: published, draft, hidden. Defaults to published. Only published posts appear in feeds.'
        required: false
        example: published
        type: string
        enumValues:
          - published
          - draft
          - hidden
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      reposted_from_id:
        custom: []
        name: reposted_from_id
        description: 'If this is a repost, the id of the original post. Must match an existing stored value.'
        required: false
        example: null
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      media:
        custom: []
        name: media
        description: 'Attached media.'
        required: false
        example: null
        type: 'object[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      hashtags:
        custom: []
        name: hashtags
        description: 'A hashtag name, without the leading #. Must not be greater than 255 characters.'
        required: false
        example:
          - laravel
        type: 'string[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'media[].url':
        custom: []
        name: 'media[].url'
        description: 'A publicly resolvable media URL. Must be a valid URL.'
        required: true
        example: 'https://example.com/media/1.jpg'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'media[].position':
        custom: []
        name: 'media[].position'
        description: 'Display order within the post, 0-indexed. Must be at least 0.'
        required: false
        example: 0
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      author_id: 42
      content: 'Hello world'
      type: text
      status: published
      hashtags:
        - laravel
      media:
        -
          url: 'https://example.com/media/1.jpg'
          position: 0
    fileParameters: []
    responses: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
