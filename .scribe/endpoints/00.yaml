        required: true
        example: 16
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      post:
        custom: []
        name: post
        description: "The post's id."
        required: true
        example: 1001
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      post_id: 16
      post: 1001
    queryParameters:
      viewer_id:
        custom: []
        name: viewer_id
        description: 'The id of the user viewing, as used by the calling backend. Adds a "liked" flag to each item. Must be at least 1.'
        required: false
        example: 42
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanQueryParameters:
      viewer_id: 42
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
